<div class="container mt-4">
  <div class="row" *ngIf="product">
    <div class="col-md-6">
      <img [src]="product.image" class="img-fluid" style="max-height: 400px; object-fit: contain;" [alt]="product.title">
    </div>
    <div class="col-md-6">
      <h2>{{ product.title }}</h2>
      <p class="text-muted">Category: {{ product.category }}</p>
      <p>{{ product.description }}</p>
      <h3 class="text-primary">${{ product.price }}</h3>
      <p class="text-warning" *ngIf="product.rating">
        Rating: {{ product.rating.rate }}/5 ({{ product.rating.count }} reviews)
      </p>
      <div class="mt-4">
        <button class="btn btn-success btn-lg me-2">Add to Cart</button>
        <button class="btn btn-outline-primary btn-lg">Buy Now</button>
      </div>
    </div>
  </div>
  <div *ngIf="!product" class="text-center">
    <h3>Product not found</h3>
  </div>
</div>
