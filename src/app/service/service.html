<div class="container mt-4">
  <h1>Products</h1>
  <div class="row">
    <div class="col-md-4 mb-3" *ngFor="let product of products">
      <div class="card h-100">
        <img [src]="product.image" class="card-img-top" style="height: 200px; object-fit: contain;">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ product.title }}</h5>
          <p class="card-text">{{ product.description | slice:0:100 }}...</p>
          <p class="card-text"><strong>${{ product.price }}</strong></p>
          <div class="mt-auto">
            <a [routerLink]="['/singleview-list', product.id]" class="btn btn-primary">Get Details</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
