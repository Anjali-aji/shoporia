<div class="container">
  <h2>Our Products</h2>
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let product of products">
      <div class="card h-100">
        <img [src]="product.image" class="card-img-top" style="height: 200px; object-fit: contain;" [alt]="product.title">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{product.title}}</h5>
          <p class="card-text">{{product.description | slice:0:100}}...</p>
          <p class="text-primary fw-bold">${{product.price}}</p>
          <div class="mt-auto">
            <a [routerLink]="['/singleview-list',product.id]" class="btn btn-primary">View Details</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
